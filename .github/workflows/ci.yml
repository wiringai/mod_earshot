name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # Portable core (codec, backpressure queue, Pipecat protobuf) and the WebSocket
  # transport against a loopback server — no FreeSWITCH needed, so this runs everywhere
  # and is the primary green signal.
  unit:
    name: unit tests (portable core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libwebsockets-dev
      - name: Configure & build tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target test_codec test_pb test_cmdguard test_util test_command_dispatch test_proto_audio test_ws_idle test_ws_reconnect --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # The module itself needs FreeSWITCH dev headers (SignalWire apt repo, token-gated).
  # Runs only when the SW_TOKEN secret is present; produces the .so and a .deb.
  #
  # One build per Debian release, because that is what actually differs: each release
  # has its own libwebsockets and OpenSSL, and the SignalWire channel serves its own
  # FreeSWITCH packages for it. The FreeSWITCH version is whatever that channel carries
  # on the day (1.11.x on both today; it no longer carries 1.10 for either), so the job
  # does not claim one: each build writes what it was built against to BUILD_INFO, which
  # is printed in the job summary and shipped inside the artifact.
  module:
    name: build module + .deb (Debian ${{ matrix.debian }})
    runs-on: ubuntu-latest
    needs: unit
    # Compile mod_earshot.c on pushes AND on same-repo PRs (which have the secret) so a build
    # break can't slip through PR review and land on main. Fork PRs (different head repo) get no
    # secret, so they're skipped rather than failing.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        debian: [ "12", "13" ]
    steps:
      - uses: actions/checkout@v4
      - name: Build in Docker (installs libfreeswitch-dev when SW_TOKEN is set)
        env:
          SW_TOKEN: ${{ secrets.SW_TOKEN }}
        run: |
          if [ -z "$SW_TOKEN" ]; then
            echo "::notice::SW_TOKEN secret not set — skipping module/.deb build (unit tests already passed)."
            exit 0
          fi
          docker build --build-arg DEBIAN="${{ matrix.debian }}" --build-arg SW_TOKEN="$SW_TOKEN" -t earshot-build .
          id=$(docker create earshot-build); docker cp "$id:/out" ./out; docker rm "$id"
          ls -la out
          { echo "### Built on Debian ${{ matrix.debian }}"; echo '```'; cat out/BUILD_INFO; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # The module must exist when the headers were installed: without this, a build
          # that silently skipped the module target would still pass.
          test -f out/mod_earshot.so || { echo "::error::no mod_earshot.so was built"; exit 1; }
      - name: Upload artifacts
        if: ${{ hashFiles('out/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mod_earshot-debian${{ matrix.debian }}
          path: out/*
