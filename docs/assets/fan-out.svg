<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Several streams on one call</title>
  <desc id="d">One phone call in FreeSWITCH with three mod_earshot streams: a two-way stream to the AI agent, a listen-only stream to a transcription service, and a listen-only stream to a supervisor. During card entry the mask command mutes the caller's audio and digits to every stream.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="328" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <rect x="60" y="105" width="300" height="120" rx="14" fill="#0f766e"/>
  <text x="210" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">One call</text>
  <text x="210" y="180" text-anchor="middle" font-size="15" fill="#ccfbf1">FreeSWITCH + mod_earshot</text>
  <text x="210" y="202" text-anchor="middle" font-size="13" fill="#ccfbf1">each stream has its own id=</text>

  <g font-size="15">
    <rect x="700" y="34" width="440" height="72" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="920" y="64" text-anchor="middle" font-weight="700" font-size="18" fill="#0f172a">AI agent</text>
    <text x="920" y="88" text-anchor="middle" fill="#475569">two-way: hears the caller, speaks, controls the call</text>

    <rect x="700" y="129" width="440" height="72" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="920" y="159" text-anchor="middle" font-weight="700" font-size="18" fill="#0f172a">Live transcription</text>
    <text x="920" y="183" text-anchor="middle" fill="#475569">listen-only (dir=in): Deepgram, AssemblyAI, Cartesia</text>

    <rect x="700" y="224" width="440" height="72" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="920" y="254" text-anchor="middle" font-weight="700" font-size="18" fill="#0f172a">Supervisor or QA</text>
    <text x="920" y="278" text-anchor="middle" fill="#475569">listen-only (dir=in): monitor a call as it happens</text>
  </g>

  <path d="M364 140 C 520 140, 540 70, 696 70" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M364 165 L 696 165" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M364 190 C 520 190, 540 260, 696 260" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#g)"/>

  <rect x="360" y="262" width="320" height="44" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="520" y="281" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">mask on, during card entry</text>
  <text x="520" y="298" text-anchor="middle" font-size="12" fill="#b91c1c">caller audio and digits muted to every stream</text>
</svg>
