<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How mod_earshot connects a phone call to an AI agent</title>
  <desc id="d">A caller reaches FreeSWITCH over SIP and RTP. mod_earshot, inside FreeSWITCH, sends the caller's audio to an AI agent over one WebSocket and plays the agent's audio back. Events and latency metrics go to your application over the event socket.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="428" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- caller -->
  <rect x="30" y="130" width="190" height="120" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="125" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Caller</text>
  <text x="125" y="212" text-anchor="middle" font-size="15" fill="#475569">phone · SIP trunk</text>

  <!-- freeswitch -->
  <rect x="330" y="70" width="330" height="240" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="495" y="106" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">FreeSWITCH</text>
  <text x="495" y="128" text-anchor="middle" font-size="14" fill="#64748b">owns the call: routing, bridging, recording</text>
  <rect x="362" y="150" width="266" height="130" rx="12" fill="#0f766e"/>
  <text x="495" y="188" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">mod_earshot</text>
  <text x="495" y="216" text-anchor="middle" font-size="14" fill="#ccfbf1">codec · resample · barge-in</text>
  <text x="495" y="238" text-anchor="middle" font-size="14" fill="#ccfbf1">turn detection · PCI mask</text>
  <text x="495" y="260" text-anchor="middle" font-size="14" fill="#ccfbf1">reconnect · bounded queue</text>

  <!-- agent -->
  <rect x="820" y="70" width="340" height="240" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="990" y="106" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Your AI agent</text>
  <text x="990" y="128" text-anchor="middle" font-size="14" fill="#64748b">unchanged: pick its protocol with proto=</text>
  <g font-size="14" fill="#0f172a">
    <rect x="842" y="148" width="142" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="913" y="168" text-anchor="middle">OpenAI Realtime</text>
    <rect x="996" y="148" width="142" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="1067" y="168" text-anchor="middle">Deepgram</text>
    <rect x="842" y="186" width="142" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="913" y="206" text-anchor="middle">ElevenLabs</text>
    <rect x="996" y="186" width="142" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="1067" y="206" text-anchor="middle">Gemini Live</text>
    <rect x="842" y="224" width="142" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="913" y="244" text-anchor="middle">Pipecat</text>
    <rect x="996" y="224" width="142" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="1067" y="244" text-anchor="middle">Vapi · Twilio</text>
    <rect x="842" y="262" width="296" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="990" y="282" text-anchor="middle">any WebSocket server (native)</text>
  </g>

  <!-- caller <-> FS -->
  <line x1="224" y1="178" x2="326" y2="178" stroke="#64748b" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="326" y1="206" x2="224" y2="206" stroke="#64748b" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="275" y="166" text-anchor="middle" font-size="13" fill="#475569">SIP + RTP</text>

  <!-- earshot <-> agent -->
  <line x1="632" y1="196" x2="816" y2="196" stroke="#0f766e" stroke-width="3" marker-end="url(#a)"/>
  <line x1="816" y1="232" x2="632" y2="232" stroke="#0f766e" stroke-width="3" marker-end="url(#a)"/>
  <text x="724" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">caller audio</text>
  <text x="724" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">agent audio, commands</text>
  <text x="724" y="216" text-anchor="middle" font-size="12" fill="#64748b">one WebSocket</text>

  <!-- events -->
  <line x1="495" y1="312" x2="495" y2="352" stroke="#64748b" stroke-width="2.5" marker-end="url(#g)"/>
  <rect x="250" y="356" width="490" height="50" rx="12" fill="#fefce8" stroke="#fde68a" stroke-width="2"/>
  <text x="495" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">Your application, over the event socket</text>
  <text x="495" y="397" text-anchor="middle" font-size="13" fill="#854d0e">typed call events · time to first audio · per-turn latency · transcripts</text>
</svg>
